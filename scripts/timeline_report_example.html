<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollout Timeline</title>
<style>
  :root {
    color-scheme: light;
    --plane: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --crit: #d03b3b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
  body { background: var(--plane); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 15px; margin: 0 0 2px; letter-spacing: -0.005em; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 20px; }
  .note { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 14px; max-width: 74ch; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
          padding: 16px 18px 14px; margin: 0 0 16px; position: relative; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: 1px;
           background: var(--border); border: 1px solid var(--border); border-radius: 10px;
           overflow: hidden; margin: 0 0 16px; }
  .tile { background: var(--surface); padding: 12px 14px; }
  .tile .v { font-size: 21px; letter-spacing: -0.02em; }
  .tile .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase;
             letter-spacing: 0.04em; margin-top: 2px; }
  .tile .h { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
  .tabs { display: flex; gap: 6px; margin: 0 0 16px; flex-wrap: wrap; }
  .tab { font: inherit; font-size: 13px; padding: 6px 13px; border-radius: 999px;
         border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
         cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--s1); border-color: var(--s1); color: #fff; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2);
            margin: 8px 0 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px;
          font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase;
       letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: 0; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
  .scroll { overflow-x: auto; }
  .tall { max-height: 340px; overflow-y: auto; }
  .tall thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; }
  th.sort { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sort:hover { color: var(--ink-2); }
  th[aria-sort] { color: var(--ink); }
  td.dim, .dim { color: var(--muted); }
  .tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity .08s;
         background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
         padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.14);
         z-index: 5; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tip b { font-weight: 600; }
  svg text { font: 11.5px system-ui, -apple-system, sans-serif; }

  /* ---------- shell: a sticky nav over two views ---------- */
  * { box-sizing: border-box; }
  body { margin: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .nav { position: sticky; top: 0; z-index: 20; background: var(--plane);
         border-bottom: 1px solid var(--border); }
  .nav-inner { max-width: 1180px; margin: 0 auto; height: 46px; display: flex; align-items: center;
               gap: 18px; padding: 0 20px; }
  .brand { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-tabs { display: flex; gap: 2px; align-self: stretch; }
  .nav-tabs a { display: flex; align-items: center; padding: 0 10px; color: var(--ink-2);
                cursor: pointer; position: relative; }
  .nav-tabs a:hover { color: var(--ink); }
  .nav-tabs a.active { color: var(--ink); }
  .nav-tabs a.active::after { content: ""; position: absolute; left: 10px; right: 10px;
                              bottom: -1px; height: 2px; background: var(--ink); }
  .nav-right { margin-left: auto; display: flex; align-items: center; }
  .icon-btn { width: 28px; height: 28px; border-radius: 4px; border: 0; background: none; font: inherit;
              color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center;
              justify-content: center; }
  .icon-btn:hover { background: var(--surface); color: var(--ink); }
  #main { padding-top: 26px; padding-bottom: 72px; }
  .view { display: none; }
  .view.active { display: block; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .page-head { margin: 0 0 16px; }
  .page-title { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .page-title .muted { font-weight: 400; margin-left: 8px; }
  .delta { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .delta.flat { color: var(--muted); }

  /* ---------- clickable tables ---------- */
  table.click tbody tr { cursor: pointer; }
  table.click tbody tr:hover td { background: var(--plane); }
  td.mono, th.mono { font-family: var(--mono); }

  /* ---------- metrics browser ---------- */
  .metrics-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 22px;
                    align-items: start; }
  @media (max-width: 860px) { .metrics-layout { grid-template-columns: 1fr; } }
  .tree { position: sticky; top: 64px; max-height: calc(100vh - 88px); overflow: auto;
          font-family: var(--mono); font-size: 12px; padding-right: 6px; }
  .tree-node { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 3px;
               cursor: pointer; color: var(--ink-2); white-space: nowrap; }
  .tree-node:hover { background: var(--surface); color: var(--ink); }
  .tree-node.active { color: var(--ink); background: var(--surface); }
  .tree-node .tw { width: 12px; color: var(--muted); text-align: center; flex: none; font-size: 10px; }
  .tree-node .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .tree-node .cnt { color: var(--muted); margin-left: auto; padding-left: 8px; font-size: 11px; }
  .tree-children { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 4px; }
  .search { border: 1px solid var(--border); border-radius: 6px; background: var(--surface);
            padding: 6px 10px; width: 320px; max-width: 100%; font-family: var(--mono);
            font-size: 12.5px; color: var(--ink); outline: none; }
  .search:focus { border-color: var(--axis); }
  .crumbs { font-family: var(--mono); font-size: 13px; margin: 0 0 8px; display: flex;
            flex-wrap: wrap; align-items: baseline; gap: 4px; }
  .crumbs a { color: var(--ink-2); cursor: pointer; }
  .crumbs a:hover { color: var(--ink); text-decoration: underline; }
  .crumbs .sepc { color: var(--muted); }
  .crumbs .cur { color: var(--ink); font-weight: 600; }
  .folders { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .folder { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border);
            border-radius: 6px; padding: 3px 9px; color: var(--ink-2); cursor: pointer;
            background: var(--surface); }
  .folder:hover { color: var(--ink); border-color: var(--axis); }
  .folder .cnt { color: var(--muted); margin-left: 5px; }
  .metrics td:not(:first-child) { white-space: nowrap; }
  .tag-cell { display: flex; flex-direction: column; gap: 1px; max-width: 460px; }
  .tag-cell .tag { font-family: var(--mono); overflow-wrap: anywhere; }
  .tag-cell .tag .dim { color: var(--muted); }
  .tag-cell .desc { font-size: 11.5px; color: var(--muted); display: -webkit-box;
                    -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---------- tag detail ---------- */
  .modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center;
           justify-content: center; padding: 24px; }
  .modal.hidden { display: none; }
  .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.42); }
  .modal-card { position: relative; background: var(--surface); border: 1px solid var(--border);
                border-radius: 12px; width: min(720px, 100%); max-height: 84vh; overflow: auto;
                padding: 16px 18px 18px; box-shadow: 0 18px 60px rgba(0,0,0,.28); }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .modal-title { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .modal-desc { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; max-width: 70ch; }
  .modal-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 0 4px;
                 font-family: var(--mono); font-size: 12.5px; }
  .modal-stats .stat-label { color: var(--muted); margin-right: 5px; }
</style>

<header class="nav">
  <div class="nav-inner">
    <span class="brand mono" id="brand"></span>
    <nav class="nav-tabs" id="tabs">
      <a data-view="overview">overview</a>
      <a data-view="metrics">metrics</a>
    </nav>
    <div class="nav-right">
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-metrics"></section>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-backdrop" data-close></div>

    <div id="modal-body"></div>
  </div>

<script>
const DATA = /*__DATA__*/null;
const SVG = "http://www.w3.org/2000/svg";
const CAT = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"].map(v => `var(${v})`);

/* ---------- formatting ---------- */
const f1 = n => n.toLocaleString(undefined, {maximumFractionDigits: 1});
const f0 = n => Math.round(n).toLocaleString();
const pct = n => (n * 100).toFixed(n < 0.1 ? 1 : 0) + "%";
function dur(s) {
  if (s < 90) return f1(s) + "s";
  let m = Math.floor(s / 60), r = Math.round(s % 60);
  if (r === 60) { m += 1; r = 0; }  // 299.7s is "5m 0s", not "4m 60s"
  return m >= 60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m ${r}s`;
}
// one call, not a total: sub-second times are the common case here
const perCall = s => s < 1 ? f0(s * 1000) + "ms" : dur(s);
function big(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2) + "G";
  if (n >= 1e6) return (n/1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1) + "k";
  return f0(n);
}
const h = (tag, attrs = {}, kids = []) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "html") e.innerHTML = v; else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) if (kid) e.appendChild(kid);
  return e;
};
const s = (tag, attrs = {}) => {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
function tip(host) {
  const t = h("div", {class: "tip"});
  host.appendChild(t);
  return {
    show(html, x, y) {
      t.innerHTML = html; t.style.opacity = 1;
      const w = t.offsetWidth, hh = t.offsetHeight, bw = host.clientWidth;
      t.style.left = Math.max(4, Math.min(bw - w - 4, x - w / 2)) + "px";
      t.style.top = Math.max(0, y - hh - 10) + "px";
    },
    hide() { t.style.opacity = 0; }
  };
}
/* nice axis ticks */
function ticks(max, n = 4) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const step = [1, 2, 2.5, 5, 10].find(m => m * mag >= raw) * mag;
  const out = [];
  for (let v = 0; v <= max * 1.0001; v += step) out.push(v);
  return out;
}

/* ---------- line chart: shared x, crosshair ---------- */
function lineChart(host, cfg) {
  const W = host.clientWidth, H = cfg.height || 190;
  const M = {t: 10, r: 12, b: cfg.xAxis === false ? 8 : 26, l: 46};
  const iw = Math.max(10, W - M.l - M.r), ih = H - M.t - M.b;
  const xs = cfg.x, n = xs.length;
  const xmax = xs[n - 1] || 1;
  const ymax = cfg.ymax || Math.max(1, ...cfg.series.flatMap(se => se.v));
  const X = v => M.l + (v / xmax) * iw, Y = v => M.t + ih - (v / ymax) * ih;
  const yf = cfg.yFmt || big, xf = cfg.xFmt || dur;
  const svg = s("svg", {width: W, height: H, role: "img", "aria-label": cfg.label || ""});

  for (const b of cfg.bands || []) {
    const x0 = X(Math.max(0, b.t0)), x1 = X(Math.min(xmax, b.t1));
    if (x1 - x0 < 0.5) continue;
    svg.appendChild(s("rect", {x: x0, y: M.t, width: x1 - x0, height: ih,
      fill: b.color, opacity: b.opacity ?? 0.09}));
    if (b.label && x1 - x0 > 44) {
      const lab = s("text", {x: (x0 + x1) / 2, y: M.t + ih - 6, fill: "var(--muted)",
        "text-anchor": "middle", "font-size": 10.5});
      lab.textContent = b.label; svg.appendChild(lab);
    }
  }
  for (const t of ticks(ymax)) {
    svg.appendChild(s("line", {x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t),
      stroke: "var(--grid)", "stroke-width": 1}));
    const lab = s("text", {x: M.l - 8, y: Y(t) + 4, fill: "var(--muted)", "text-anchor": "end"});
    lab.textContent = yf(t); svg.appendChild(lab);
  }
  if (cfg.xAxis !== false) {
    for (const t of ticks(xmax)) {
      const lab = s("text", {x: X(t), y: H - 8, fill: "var(--muted)", "text-anchor": "middle"});
      lab.textContent = xf(t); svg.appendChild(lab);
    }
  }
  for (const m of cfg.markers || []) {
    if (m.x > xmax) continue;
    svg.appendChild(s("line", {x1: X(m.x), x2: X(m.x), y1: M.t, y2: M.t + ih,
      stroke: "var(--axis)", "stroke-width": 1.5, "stroke-dasharray": "4 4"}));
    const lab = s("text", {x: X(m.x) + 5, y: M.t + 12, fill: "var(--ink-2)"});
    lab.textContent = m.label; svg.appendChild(lab);
  }
  for (const se of cfg.series) {
    let d = "";
    for (let i = 0; i < n; i++) d += (i ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(se.v[i]).toFixed(1);
    if (se.fill) {
      const a = s("path", {d: d + `L${X(xs[n-1])} ${Y(0)}L${X(xs[0])} ${Y(0)}Z`,
        fill: se.color, opacity: 0.10});
      svg.appendChild(a);
    }
    svg.appendChild(s("path", {d, fill: "none", stroke: se.color, "stroke-width": 2,
      "stroke-linejoin": "round"}));
  }
  // crosshair
  const cross = s("line", {y1: M.t, y2: M.t + ih, stroke: "var(--axis)", "stroke-width": 1, opacity: 0});
  svg.appendChild(cross);
  const dots = cfg.series.map(se => {
    const c = s("circle", {r: 4.5, fill: se.color, stroke: "var(--surface)", "stroke-width": 2, opacity: 0});
    svg.appendChild(c); return c;
  });
  const tp = tip(host);
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect();
    const px = ev.clientX - r.left;
    const i = Math.max(0, Math.min(n - 1, Math.round(((px - M.l) / iw) * xmax / (xs[1] - xs[0]))));
    cross.setAttribute("x1", X(xs[i])); cross.setAttribute("x2", X(xs[i]));
    cross.setAttribute("opacity", 1);
    cfg.series.forEach((se, k) => {
      dots[k].setAttribute("cx", X(xs[i])); dots[k].setAttribute("cy", Y(se.v[i]));
      dots[k].setAttribute("opacity", 1);
    });
    tp.show(`<b>${xf(xs[i])}</b> ${cfg.xName || "into rollout"}<br>` + cfg.series.map(se =>
      `<span class="swatch" style="background:${se.color}"></span> ${se.name} <b>${cfg.fmt ? cfg.fmt(se.v[i]) : f0(se.v[i])}</b>`
    ).join("<br>"), px, ev.clientY - r.top);
  });
  svg.addEventListener("pointerleave", () => {
    cross.setAttribute("opacity", 0); dots.forEach(d => d.setAttribute("opacity", 0)); tp.hide();
  });
  host.appendChild(svg);
  if (cfg.series.length > 1) {
    host.appendChild(h("div", {class: "legend"}, cfg.series.map(se =>
      h("span", {html: `<span class="swatch" style="background:${se.color}"></span>${se.name}`}))));
  }
}

/* ---------- vertical bars ---------- */
function barChart(host, cfg) {
  const W = host.clientWidth, H = cfg.height || 190;
  const M = {t: 14, r: 10, b: 40, l: 46};
  const iw = Math.max(10, W - M.l - M.r), ih = H - M.t - M.b;
  const items = cfg.items, ymax = Math.max(1, ...items.map(d => d.value));
  const bw = iw / items.length, pad = Math.min(10, bw * 0.22);
  const Y = v => M.t + ih - (v / ymax) * ih;
  const svg = s("svg", {width: W, height: H});
  for (const t of ticks(ymax)) {
    svg.appendChild(s("line", {x1: M.l, x2: M.l + iw, y1: Y(t), y2: Y(t), stroke: "var(--grid)"}));
    const lab = s("text", {x: M.l - 8, y: Y(t) + 4, fill: "var(--muted)", "text-anchor": "end"});
    lab.textContent = big(t); svg.appendChild(lab);
  }
  svg.appendChild(s("line", {x1: M.l, x2: M.l + iw, y1: Y(0), y2: Y(0), stroke: "var(--axis)"}));
  const tp = tip(host);
  items.forEach((d, i) => {
    const x = M.l + i * bw + pad / 2, w = bw - pad;
    const hh = Math.max(1.5, ih * (d.value / ymax));
    const r = s("rect", {x, y: Y(d.value), width: w, height: hh, rx: Math.min(4, w / 2),
      fill: d.color || cfg.color || CAT[0]});
    r.addEventListener("pointerenter", ev => {
      const b = svg.getBoundingClientRect();
      tp.show(`<b>${d.label}</b><br>${cfg.valueName || ""} <b>${cfg.fmt ? cfg.fmt(d.value) : f0(d.value)}</b>` +
        (d.sub ? `<br>${d.sub}` : ""), x + w / 2, ev.clientY - b.top);
    });
    r.addEventListener("pointerleave", () => tp.hide());
    svg.appendChild(r);
    const lab = s("text", {x: x + w / 2, y: H - 24, fill: "var(--muted)", "text-anchor": "middle"});
    lab.textContent = d.label; svg.appendChild(lab);
    if (d.foot) {
      const f = s("text", {x: x + w / 2, y: H - 9, fill: "var(--muted)", "text-anchor": "middle"});
      f.textContent = d.foot; svg.appendChild(f);
    }
  });
  host.appendChild(svg);
}

/* ---------- horizontal stacked bar ---------- */
function stackBar(host, cfg) {
  const W = host.clientWidth, H = cfg.height || 30;
  const total = cfg.segments.reduce((a, d) => a + d.value, 0) || 1;
  const scale = cfg.total || total;
  const svg = s("svg", {width: W, height: H});
  const tp = tip(host);
  let x = 0;
  cfg.segments.forEach((d, i) => {
    const w = Math.max(0, (d.value / scale) * W - 2);
    const r = s("rect", {x, y: 0, width: w, height: H, rx: 3, fill: d.color || CAT[i]});
    r.addEventListener("pointerenter", ev => {
      const b = svg.getBoundingClientRect();
      tp.show(`<span class="swatch" style="background:${d.color || CAT[i]}"></span> <b>${d.label}</b><br>` +
        `${cfg.fmt ? cfg.fmt(d.value) : dur(d.value)} · ${pct(d.value / scale)}`, x + w / 2, ev.clientY - b.top);
    });
    r.addEventListener("pointerleave", () => tp.hide());
    svg.appendChild(r);
    x += (d.value / scale) * W;
  });
  host.appendChild(svg);
  if (cfg.legend !== false) {
    host.appendChild(h("div", {class: "legend"}, cfg.segments.map((d, i) =>
      h("span", {html: `<span class="swatch" style="background:${d.color || CAT[i]}"></span>` +
        `${d.label} <b>${pct(d.value / total)}</b> ` +
        `<span style="color:var(--muted)">${cfg.fmt ? cfg.fmt(d.value) : dur(d.value)}</span>`}))));
  }
}

/* ---------- trajectory trace: one row per episode, zoom + pan ---------- */
const KIND_COLOR = ["", "--axis", "--s3", "--s1", "--s2", "--s7", "--muted", "--s4"];
const KIND_LABEL = ["gap", "waiting for a slot", "container start", "generate", "tool call",
                    "grading", "cleanup", "patch recovery"];

function traceView(host, st) {
  const css = getComputedStyle(document.documentElement);
  const col = v => css.getPropertyValue(v).trim() || "#888";
  const colors = KIND_COLOR.map(v => v ? col(v) : null);
  const surface = col("--surface"), grid = col("--grid"), ink2 = col("--ink-2"), muted = col("--muted");

  for (const r of st.trace) {
    if (r.T === undefined) r.T = r.d.reduce((x, v, i) => i % 2 ? x + v : x, 0);
  }
  const rowsByStart = st.trace;
  const rowsByDur = st.trace.slice().sort((a, b) => b.T - a.T);
  let rows = rowsByStart, sortMode = "start";
  // A row runs past its episode envelope: grading happens after the agent loop
  // is done, and it is the last of those verdicts that the step barrier waits on.
  const genEnd = (st.gen_dur - st.t_offset) * 1000;
  const span = Math.max(st.span * 1000, genEnd, ...st.trace.map(r => r.s + r.T));
  const H = 520;
  let W = Math.max(320, host.clientWidth);
  let vx0 = 0, vx1 = span;          // visible time window, ms
  let rowTop = 0, rowH = H / rows.length;  // first visible row (fractional) and px per row

  const bar = h("div", {style: "display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px"});
  const mk = (label, fn) => { const b = h("button", {class: "tab", text: label}); b.onclick = fn; return b; };
  const sortBtn = mk("sort: admission order", () => {
    sortMode = sortMode === "start" ? "dur" : "start";
    rows = sortMode === "start" ? rowsByStart : rowsByDur;
    sortBtn.textContent = "sort: " + (sortMode === "start" ? "admission order" : "longest first");
    draw();
  });
  bar.appendChild(sortBtn);
  bar.appendChild(mk("reset zoom", () => { vx0 = 0; vx1 = span; rowTop = 0; rowH = H / rows.length; draw(); }));
  bar.appendChild(h("span", {style: "font-size:12px;color:var(--muted)",
    text: "wheel = zoom time · shift+wheel = scroll rows · ctrl+wheel = zoom rows · drag = pan"}));
  host.appendChild(bar);

  const canvas = h("canvas", {style: `width:100%;height:${H}px;display:block;cursor:crosshair;` +
    `border:1px solid var(--border);border-radius:8px;background:var(--surface)`});
  host.appendChild(canvas);
  host.appendChild(h("div", {class: "legend"}, [1, 2, 3, 4, 5, 6, 7].map(k =>
    h("span", {html: `<span class="swatch" style="background:${colors[k]}"></span>${KIND_LABEL[k]}`}))));
  const tp = tip(host);
  const ctx = canvas.getContext("2d");

  function gutter() { return rowH >= 9 ? Math.min(200, W * 0.22) : 0; }
  const X = t => gutter() + ((t - vx0) / (vx1 - vx0)) * (W - gutter());
  const T = x => vx0 + ((x - gutter()) / (W - gutter())) * (vx1 - vx0);

  let pending = false;
  function draw() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => { pending = false; paint(); });
  }
  function paint() {
    const dpr = window.devicePixelRatio || 1;
    W = Math.max(320, host.clientWidth);
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const g = gutter(), plotW = W - g;
    const scale = plotW / (vx1 - vx0);

    // time grid
    ctx.font = "11.5px system-ui, sans-serif"; ctx.textBaseline = "top";
    ctx.strokeStyle = grid; ctx.fillStyle = muted; ctx.lineWidth = 1;
    const tk = ticks((vx1 - vx0) / 1000, 6);
    const tstep = ((tk[1] || 1) - (tk[0] || 0)) * 1000;
    for (let v = Math.ceil(vx0 / tstep) * tstep; v <= vx1 && tstep > 0; v += tstep) {
      const x = Math.round(X(v)) + 0.5;
      if (x < g) continue;
      ctx.beginPath(); ctx.moveTo(x, 16); ctx.lineTo(x, H); ctx.stroke();
      ctx.fillText(dur(v / 1000), x + 4, 2);
    }
    // reference instants: a perfect packing, and the end of the trainer's gen phase
    ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = ink2;
    for (const m of [[st.ideal_s * 1000, "perfect packing"], [genEnd, "generate phase ends"]]) {
      const xi = X(m[0]);
      if (xi <= g || xi > W) continue;
      ctx.beginPath(); ctx.moveTo(xi, 16); ctx.lineTo(xi, H); ctx.stroke();
      ctx.fillStyle = ink2; ctx.fillText(m[1], Math.min(xi + 4, W - 100), 2);
      ctx.fillStyle = muted;
    }
    ctx.restore();

    // rows -- batched per kind so the fill style is set 7 times, not 180,000
    const top = 18;
    const first = Math.max(0, Math.floor(rowTop));
    const last = Math.min(rows.length, Math.ceil(rowTop + (H - top) / rowH));
    const buckets = colors.map(() => []);
    // No minimum height: a sub-pixel row antialiases to its true share of the pixel,
    // so 2,000 rows read as density instead of smearing over each other.
    const rh = rowH > 3 ? rowH - 1 : rowH;  // 1px lane gap once rows are tall enough
    const acc = new Float64Array(colors.length);

    for (let i = first; i < last; i++) {
      const r = rows[i], y = top + (i - rowTop) * rowH, d = r.d;
      // Sub-pixel segments are not widened to a visible sliver -- that would paint
      // 3% of the wall clock as half the row. Each pixel column instead shows the
      // kind that owns the most of it, so a zoomed-out row is honest by area.
      let t = r.s, col = -1, runK = 0, runX0 = 0, runX1 = 0;
      // adjacent same-kind pixels become one rect: ~4x fewer fills per frame
      const emit = (kind, x0, x1) => {
        if (kind === runK && x0 - runX1 < 0.51) { runX1 = Math.max(runX1, x1); return; }
        if (runK) buckets[runK].push(g + runX0, y, Math.max(0.7, runX1 - runX0), rh);
        runK = kind; runX0 = x0; runX1 = x1;
      };
      const flush = () => {
        if (col < 0) return;
        let best = 0, bv = 0;
        for (let k = 0; k < acc.length; k++) { if (acc[k] > bv) { bv = acc[k]; best = k; } acc[k] = 0; }
        emit(best, col, col + 1);
        col = -1;
      };
      for (let k = 0; k < d.length; k += 2) {
        const kind = d[k], t1 = t + d[k + 1];
        if (t > vx1) break;
        if (t1 > vx0) {
          // charge every pixel column for the share of it this segment covers, so
          // the winner of a column is the kind that really owns most of that column
          let x = Math.max(0, (t - vx0) * scale);
          const x1 = Math.min(plotW, (t1 - vx0) * scale);
          while (x < x1) {
            const c = Math.floor(x), nx = Math.min(x1, c + 1);
            if (c !== col) { flush(); col = c; }
            acc[kind] += nx - x;
            x = nx === x ? x + 1e-6 : nx;
          }
        }
        t = t1;
      }
      flush();
      emit(0, 0, 0);  // close the last run
    }
    for (let k = 1; k < buckets.length; k++) {
      const b = buckets[k];
      if (!b.length) continue;
      ctx.fillStyle = colors[k];
      for (let j = 0; j < b.length; j += 4) ctx.fillRect(b[j], b[j + 1], b[j + 2], b[j + 3]);
    }
    // row labels, once there is room for them
    if (g) {
      ctx.fillStyle = ink2; ctx.textBaseline = "middle";
      ctx.save(); ctx.beginPath(); ctx.rect(0, top, g - 6, H - top); ctx.clip();
      for (let i = first; i < last; i++) {
        const y = top + (i - rowTop) * rowH + rowH / 2;
        if (rowH >= 11) ctx.fillText(DATA.instances[rows[i].i], 6, y);
      }
      ctx.restore();
      ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(g - 0.5, top); ctx.lineTo(g - 0.5, H); ctx.stroke();
    }
    ctx.fillStyle = muted; ctx.textBaseline = "top";
    ctx.fillText(`${first + 1}–${Math.min(last, rows.length)} of ${rows.length} episodes`, g + 6, H - 16);
  }

  function rowAt(y) {
    const i = Math.floor(rowTop + (y - 18) / rowH);
    return i >= 0 && i < rows.length ? i : -1;
  }
  canvas.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = canvas.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    if (ev.ctrlKey || ev.metaKey) {                 // zoom rows around the pointer
      const anchor = rowTop + (my - 18) / rowH;
      rowH = Math.max(H / rows.length, Math.min(26, rowH * Math.pow(1.0022, -ev.deltaY)));
      rowTop = Math.max(0, Math.min(rows.length - (H - 18) / rowH, anchor - (my - 18) / rowH));
    } else if (ev.shiftKey) {                        // scroll rows
      rowTop = Math.max(0, Math.min(Math.max(0, rows.length - (H - 18) / rowH),
        rowTop + ev.deltaY / rowH * 0.5));
    } else {                                         // zoom time around the pointer
      const t = T(mx), f = Math.pow(1.0022, ev.deltaY);
      let a = t - (t - vx0) * f, b = t + (vx1 - t) * f;
      if (b - a < 200) { const c = (a + b) / 2; a = c - 100; b = c + 100; }
      vx0 = Math.max(0, a); vx1 = Math.min(span, b);
      if (vx1 <= vx0) { vx0 = 0; vx1 = span; }
    }
    draw();
  }, {passive: false});

  let drag = null;
  canvas.addEventListener("pointerdown", ev => {
    drag = {x: ev.clientX, y: ev.clientY, vx0, vx1, rowTop};
    canvas.setPointerCapture(ev.pointerId); canvas.style.cursor = "grabbing";
  });
  canvas.addEventListener("pointerup", ev => {
    drag = null; canvas.style.cursor = "crosshair";
    canvas.releasePointerCapture(ev.pointerId);
  });
  canvas.addEventListener("dblclick", () => {
    vx0 = 0; vx1 = span; rowTop = 0; rowH = H / rows.length; draw();
  });
  canvas.addEventListener("pointerleave", () => tp.hide());
  canvas.addEventListener("pointermove", ev => {
    const r = canvas.getBoundingClientRect();
    const mx = ev.clientX - r.left, my = ev.clientY - r.top;
    if (drag) {
      const w = vx1 - vx0, dx = (ev.clientX - drag.x) / (W - gutter()) * w;
      vx0 = Math.max(0, drag.vx0 - dx); vx1 = Math.min(span, drag.vx1 - dx);
      if (vx1 - vx0 < w) { if (vx0 <= 0) vx1 = w; else vx0 = span - w; }
      rowTop = Math.max(0, Math.min(Math.max(0, rows.length - (H - 18) / rowH),
        drag.rowTop - (ev.clientY - drag.y) / rowH));
      draw(); tp.hide(); return;
    }
    const i = rowAt(my);
    if (i < 0) { tp.hide(); return; }
    const row = rows[i], t = T(mx);
    let acc = row.s, seg = null, turn = 0, tool = 0, ti = 0;
    for (let k = 0; k < row.d.length; k += 2) {
      if (row.d[k] === 3) turn++;
      if (row.d[k] === 4) ti++;
      if (t >= acc && t < acc + row.d[k + 1]) {
        seg = {kind: row.d[k], ms: row.d[k + 1], turn, tool: ti - 1};
        break;
      }
      acc += row.d[k + 1];
    }
    const total = row.T;
    const toolName = seg && seg.kind === 4 && row.tt[seg.tool] !== undefined
      ? " · " + DATA.action_names[row.tt[seg.tool]] : "";
    tp.show(
      `<b>${DATA.instances[row.i]}</b><br>` +
      `${row.x} · ${row.n} turns · reward ${row.r.toFixed(2)} · ${dur(total / 1000)}<br>` +
      `starts ${dur(row.s / 1000)} into the rollout` +
      (seg ? `<br><span class="swatch" style="background:${colors[seg.kind]}"></span> ` +
        `${KIND_LABEL[seg.kind]}${toolName} <b>${dur(seg.ms / 1000)}</b>` +
        (seg.kind === 3 || seg.kind === 4 ? ` · turn ${seg.turn}` : "") : ""),
      mx, my);
  });
  draw();
}

/* A table whose columns can be re-sorted in place. Three of this report's
   questions about a tool call -- how often, how long in total, how long each
   time -- are the same rows in a different order, so the order is a control
   rather than three tables. */
function sortTable(cols, rows, initial) {
  const host = h("div", {class: "scroll tall"});
  let key = initial, desc = true;
  const body = h("tbody");
  const heads = cols.map(c => h("th", {class: "sort", text: c.label, title: c.help || c.label}));
  const table = h("table", {}, [h("thead", {}, h("tr", {}, heads)), body]);
  const draw = () => {
    heads.forEach((th, i) => {
      if (cols[i].k === key) th.setAttribute("aria-sort", desc ? "descending" : "ascending");
      else th.removeAttribute("aria-sort");
      th.textContent = cols[i].label + (cols[i].k === key ? (desc ? " \u2193" : " \u2191") : "");
    });
    const sorted = rows.slice().sort((a, b) => {
      const x = a[key], y = b[key];
      const c = typeof x === "string" ? x.localeCompare(y) : (x - y);
      return desc ? -c : c;
    });
    body.innerHTML = "";
    for (const r of sorted) {
      body.appendChild(h("tr", {}, cols.map(c =>
        h("td", {text: c.fmt ? c.fmt(r[c.k], r) : r[c.k], class: c.dim ? "dim" : ""}))));
    }
  };
  heads.forEach((th, i) => th.addEventListener("click", () => {
    // A new column starts on its most useful order: biggest first for numbers,
    // A-Z for the name.
    if (key === cols[i].k) desc = !desc;
    else { key = cols[i].k; desc = typeof rows[0][key] !== "string"; }
    draw();
  }));
  draw();
  host.appendChild(table);
  return host;
}

function card(title, note) {
  const c = h("div", {class: "card"});
  if (title) c.appendChild(h("h2", {text: title}));
  if (note) c.appendChild(h("p", {class: "note", html: note}));
  const body = h("div");
  c.appendChild(body);
  return {card: c, body};
}
function tiles(rows) {
  return h("div", {class: "tiles"}, rows.map(r =>
    h("div", {class: "tile"}, [h("div", {class: "v", text: r.v}),
      h("div", {class: "k", text: r.k}), r.h ? h("div", {class: "h", text: r.h}) : null])));
}

/* ---------- page ---------- */
const PHASES = [
  ["gen", "rollout", CAT[0]],
  ["old_log_prob", "old log-prob", CAT[1]],
  ["ref", "ref log-prob", CAT[2]],
  ["adv", "advantage", CAT[3]],
  ["update_actor", "actor update", CAT[4]],
  ["update_weights", "weight sync", CAT[5]],
];
// DATA is null in the committed template -- it is the hole plot_timeline.py
// fills -- so everything derived from it tolerates that and the boot below
// says so, instead of throwing here and leaving a blank page.
const STEPS = (DATA && DATA.steps) || [];
const M = (DATA && DATA.metrics) || {steps: [], tags: {}, docs: {}, csv: null};
const TAG_LIST = Object.keys(M.tags);
const LAST_STEP = M.steps.length ? M.steps[M.steps.length - 1] : null;
const VIEW = {
  overview: document.getElementById("view-overview"),
  metrics: document.getElementById("view-metrics"),
};
// What the hash addresses, so a link to a group or a tag reopens it.
const S = {view: "overview", path: "", query: "", expanded: new Set(), expandedFor: null,
           sort: {k: "tag", desc: false}, tag: null};
let current = STEPS.length > 1 ? 1 : 0;

const stepLabel = st => st.phase === "val" ? `validation (step ${st.step})` : `step ${st.step}`;
function go(hash) { location.hash = hash; }

/* ---------- how a tag's numbers read ---------- */
// A metric name carries its unit: `*_rate` is a share, `timing_s/*` is seconds,
// `*_ms` is milliseconds, the rest is a plain number formatted to the precision
// its magnitude deserves. Counts inside the timing groups are the one place the
// prefix lies, so they are named.
const COUNT_IN_TIMING = /^timing_s\/agent_loop\/(num_preempted\/(min|max|mean)|slowest\/(num_preempted|prompt_length|response_length|tool_calls))$/;
function fmtOf(tag) {
  const seg = tag.split("/").pop();
  if (/^(traj|rollout)\/exit\//.test(tag)) return "pct";
  if (/(_rate|_share)$/.test(seg) || /^(rate|share)$/.test(seg)) return "pct";
  if (/(clip_ratio|hit_ratio|drain_ratio|waste_ratio|_fraction_high|_fraction_low)$/.test(seg)) return "pct";
  if (COUNT_IN_TIMING.test(tag)) return "int";
  if (/tok_s$/.test(seg) || /throughput/.test(seg)) return "num";  // a rate, not a duration
  if (/_ms$/.test(seg) || /_ms$/.test(tag.split("/")[0])) return "ms";
  if (/_s$/.test(seg) || /_s$/.test(tag.split("/")[0])) return "sec";
  return "num";
}
function num(v) {
  const a = Math.abs(v);
  if (!isFinite(v)) return String(v);
  if (a >= 1e6) return big(v);
  if (a >= 1000) return f0(v);
  if (Number.isInteger(v)) return f0(v);
  if (a >= 100) return v.toFixed(1);
  if (a >= 1) return v.toFixed(3);
  if (a === 0) return "0";
  if (a < 1e-4) return v.toExponential(2);
  return v.toFixed(4);
}
function fmtVal(v, kind) {
  if (v == null) return "—";
  if (kind === "pct") return (v * 100).toFixed(Math.abs(v) < 0.1 ? 2 : 1) + "%";
  if (kind === "sec") return perCall(v);
  if (kind === "ms") return num(v) + " ms";
  if (kind === "int") return f0(v);
  return num(v);
}
// A delta is read in the metric's own unit, except a share, which moves in
// points. It carries no colour: for an arbitrary tag, down can be the good
// direction (tail waste) or the bad one (resolve rate).
function deltaHTML(cur, prev, kind) {
  if (cur == null || prev == null || !isFinite(cur - prev)) return "";
  const d = cur - prev;
  if (Math.abs(d) < 1e-12) return `<span class="delta flat">±0</span>`;
  const txt = kind === "pct" ? `${(Math.abs(d) * 100).toFixed(2)} pt` : fmtVal(Math.abs(d), kind);
  return `<span class="delta">${d > 0 ? "▲" : "▼"}${txt}</span>`;
}

/* ---------- overview: the run, then one rollout phase at a time ---------- */
function runHeader(root) {
  const trainSteps = STEPS.filter(st => st.phases.step);
  const genShare = trainSteps.length
    ? trainSteps.reduce((a, st) => a + st.phases.gen.dur / st.phases.step.dur, 0) / trainSteps.length : 0;
  root.appendChild(h("h1", {text: `Rollout timeline · ${DATA.experiment}`}));
  root.appendChild(h("p", {class: "sub", text:
    `${dur(DATA.t_end - DATA.t_start)} of wall clock · ${STEPS.length} rollout phases · ` +
    `${f0(STEPS.reduce((a, st) => a + st.episodes, 0))} episodes · ` +
    `${big(STEPS.reduce((a, st) => a + st.out_tok, 0))} decoded tokens`}));

  if (!trainSteps.length) return;
  const c = card("Where a training step's wall clock goes",
    `Rollout is <b>${pct(genShare)}</b> of the step; the rest is the training half — no episode is running ` +
    `during it, and the inference server is idle. Bars share one scale, so step length is comparable.`);
  for (const st of trainSteps) {
    const segs = PHASES.filter(([k]) => st.phases[k]).map(([k, name, color]) =>
      ({label: name, value: st.phases[k].dur, color}));
    const acc = segs.reduce((a, d) => a + d.value, 0);
    if (st.phases.step.dur - acc > 1) segs.push({label: "other", value: st.phases.step.dur - acc, color: "var(--axis)"});
    const row = h("div", {style: "margin: 10px 0 0"});
    row.appendChild(h("div", {style: "font-size:12.5px;color:var(--ink-2);margin-bottom:4px",
      text: `step ${st.step} · ${dur(st.phases.step.dur)}`}));
    const holder = h("div", {style: "position:relative"});
    row.appendChild(holder);
    c.body.appendChild(row);
    queueMicrotask(() => stackBar(holder, {segments: segs, height: 26,
      total: Math.max(...trainSteps.map(x => x.phases.step.dur)),
      legend: st === trainSteps[trainSteps.length - 1]}));
  }
  root.appendChild(c.card);
}

function stepTabs(root) {
  const bar = h("div", {class: "tabs", role: "tablist"});
  STEPS.forEach((st, i) => {
    const b = h("button", {class: "tab", role: "tab", text: stepLabel(st)});
    b.setAttribute("aria-selected", i === current);
    b.onclick = () => { current = i; overviewView(root); };
    bar.appendChild(b);
  });
  root.appendChild(bar);
}

function overviewView(root) {
  root.innerHTML = "";
  runHeader(root);
  stepTabs(root);
  root.appendChild(stepView(STEPS[current]));
}

/* ---------- metrics: the tag tree ---------- */
function buildTree(tags) {
  const root = {name: "", path: "", children: new Map(), leaves: [], total: 0};
  for (const tag of tags) {
    const parts = tag.split("/");
    let node = root;
    node.total++;
    for (let i = 0; i < parts.length - 1; i++) {
      const path = parts.slice(0, i + 1).join("/");
      if (!node.children.has(parts[i]))
        node.children.set(parts[i], {name: parts[i], path, children: new Map(), leaves: [], total: 0});
      node = node.children.get(parts[i]);
      node.total++;
    }
    node.leaves.push(tag);
  }
  return root;
}
const TREE = buildTree(TAG_LIST);
const kids = node => [...node.children.values()].sort((a, b) => a.name.localeCompare(b.name));
function nodeAt(path) {
  let node = TREE;
  for (const part of path ? path.split("/") : []) {
    node = node.children.get(part);
    if (!node) return null;
  }
  return node;
}

function tagStats(tag) {
  const vals = M.tags[tag] || [];
  const pts = [];
  vals.forEach((v, i) => { if (v != null) pts.push([M.steps[i], v]); });
  if (!pts.length) return null;
  const v = pts.map(p => p[1]);
  return {pts, n: v.length, first: v[0], last: v[v.length - 1], prev: v.length > 1 ? v[v.length - 2] : null,
          min: Math.min(...v), max: Math.max(...v), mean: v.reduce((a, b) => a + b, 0) / v.length,
          lastStep: pts[pts.length - 1][0]};
}

function metricsView(root) {
  if (!TAG_LIST.length) {
    root.innerHTML = "";
    root.appendChild(h("p", {class: "note", text:
      "No per-step scalars: this report was built without a metrics.csv next to it and the timeline " +
      "carries no training steps. Run scripts/build_metrics_csv.py --log <run>/run.log first."}));
    return;
  }
  root.innerHTML = "";
  const head = h("div", {class: "page-head"});
  head.appendChild(h("h1", {class: "page-title", html:
    `metrics <span class="muted">${TAG_LIST.length} tags · ${M.steps.length} steps</span>`}));
  head.appendChild(h("p", {class: "sub", style: "margin:4px 0 0", html:
    `Every per-step scalar the run produced, as numbers — ${M.csv ? `<b>${M.csv}</b>, i.e. what the ` +
    `trainer printed to its log and sent to W&B, ` : ""}plus the <b>rollout/*</b> reductions only the ` +
    `timeline can make. Click a tag for its value at every step; the charts are in the overview.`}));
  root.appendChild(head);

  const search = h("input", {class: "search", type: "search", placeholder: "filter tags (substring or /regex/)"});
  search.value = S.query;
  search.oninput = () => { S.query = search.value.trim(); renderTags(); renderTree(); };
  root.appendChild(h("div", {style: "margin:0 0 14px"}, search));

  const treeHost = h("nav", {class: "tree"});
  const mainHost = h("div");
  root.appendChild(h("div", {class: "metrics-layout"}, [treeHost, mainHost]));

  function renderTree() {
    treeHost.innerHTML = "";
    if (S.expandedFor !== S.path) {
      const parts = S.path ? S.path.split("/") : [];
      for (let i = 1; i <= parts.length; i++) S.expanded.add(parts.slice(0, i).join("/"));
      S.expandedFor = S.path;
    }
    const build = node => {
      const frag = document.createDocumentFragment();
      for (const c of kids(node)) {
        const open = S.expanded.has(c.path);
        const row = h("div", {class: "tree-node" + (S.path === c.path ? " active" : ""), html:
          `<span class="tw">${c.children.size ? (open ? "▾" : "▸") : ""}</span>` +
          `<span class="nm">${c.name}</span><span class="cnt">${c.total}</span>`});
        row.querySelector(".tw").onclick = e => {
          e.stopPropagation();
          S.expanded.has(c.path) ? S.expanded.delete(c.path) : S.expanded.add(c.path);
          renderTree();
        };
        row.onclick = () => go(`#metrics/${c.path}`);
        frag.appendChild(row);
        if (c.children.size && open) frag.appendChild(h("div", {class: "tree-children"}, build(c)));
      }
      return frag;
    };
    treeHost.appendChild(build(TREE));
  }

  const COLS = [
    {k: "tag", label: "tag"},
    {k: "last", label: "last"},
    {k: "delta", label: "Δ prev"},
    {k: "min", label: "min"},
    {k: "max", label: "max"},
    {k: "mean", label: "mean"},
    {k: "n", label: "steps"},
  ];
  function renderTags() {
    mainHost.innerHTML = "";
    let leaves, folders = [];
    if (S.query) {
      const m = S.query.match(/^\/(.+)\/([a-z]*)$/);
      let re = null;
      try { re = m ? new RegExp(m[1], m[2]) : null; } catch (e) { re = null; }
      const q = S.query.toLowerCase();
      leaves = TAG_LIST.filter(t => re ? re.test(t) : t.toLowerCase().includes(q));
      mainHost.appendChild(h("div", {class: "crumbs", html:
        `<span class="cur">${leaves.length} tags match</span> <span class="muted">${S.query}</span>`}));
    } else {
      const node = nodeAt(S.path);
      if (!node) { mainHost.appendChild(h("p", {class: "note", text: `no such path: ${S.path}`})); return; }
      leaves = node.leaves.slice().sort();
      folders = kids(node);
      const parts = S.path ? S.path.split("/") : [];
      const cr = h("div", {class: "crumbs", html:
        `<a data-p="">all</a>` + parts.map((p, i) => `<span class="sepc">/</span>` + (i === parts.length - 1
          ? `<span class="cur">${p}</span>`
          : `<a data-p="${parts.slice(0, i + 1).join("/")}">${p}</a>`)).join("") +
        `<span class="muted">&nbsp; ${node.total} tags</span>`});
      cr.querySelectorAll("a").forEach(a => { a.onclick = () => go(`#metrics/${a.dataset.p}`); });
      mainHost.appendChild(cr);
      if (folders.length) {
        const fl = h("div", {class: "folders"});
        for (const f of folders) {
          const b = h("button", {class: "folder", html: `${f.name}/<span class="cnt">${f.total}</span>`});
          b.onclick = () => go(`#metrics/${f.path}`);
          fl.appendChild(b);
        }
        mainHost.appendChild(fl);
      }
    }
    if (!leaves.length) {
      mainHost.appendChild(h("p", {class: "note", text: folders.length
        ? `${folders.length} groups, ${nodeAt(S.path).total} tags below this one — open one, or search across all ${TAG_LIST.length}.`
        : "nothing here"}));
      return;
    }

    const rows = leaves.map(tag => {
      const s = tagStats(tag), kind = fmtOf(tag);
      return {tag, kind, s, delta: s && s.prev != null ? s.last - s.prev : null};
    });
    const key = S.sort.k;
    rows.sort((a, b) => {
      if (key === "tag") return a.tag.localeCompare(b.tag) * (S.sort.desc ? -1 : 1);
      const av = key === "delta" ? a.delta : a.s && a.s[key], bv = key === "delta" ? b.delta : b.s && b.s[key];
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * (S.sort.desc ? -1 : 1);
    });
    const thead = h("tr", {}, COLS.map(c => {
      const th = h("th", {class: "sort", text: c.label});
      if (c.k === key) th.setAttribute("aria-sort", S.sort.desc ? "descending" : "ascending");
      th.onclick = () => {
        if (key === c.k) S.sort.desc = !S.sort.desc;
        else S.sort = {k: c.k, desc: c.k !== "tag"};
        renderTags();
      };
      return th;
    }));
    const table = h("table", {class: "click metrics"}, [h("thead", {}, thead)]);
    table.appendChild(h("tbody", {}, rows.map(r => {
      const s = r.s, f = v => fmtVal(v, r.kind);
      const shown = S.query || !S.path ? r.tag : r.tag.slice(S.path.length + 1);
      const doc = M.docs[r.tag] || "";
      const tr = h("tr", {}, [
        h("td", {html: `<div class="tag-cell"><span class="tag">${shown}</span>` +
          (doc ? `<span class="desc">${doc.replace(/</g, "&lt;")}</span>` : "") + `</div>`}),
        h("td", {html: s ? f(s.last) + (s.lastStep === LAST_STEP ? "" :
          `<span class="dim" title="last logged at step ${s.lastStep}"> @${s.lastStep}</span>`) : "—"}),
        h("td", {html: s ? (deltaHTML(s.last, s.prev, r.kind) || "—") : "—"}),
        h("td", {text: s ? f(s.min) : "—"}),
        h("td", {text: s ? f(s.max) : "—"}),
        h("td", {text: s ? f(s.mean) : "—"}),
        h("td", {class: "dim", text: s ? f0(s.n) : "0"}),
      ]);
      tr.onclick = () => openTag(r.tag);
      return tr;
    })));
    mainHost.appendChild(h("div", {class: "scroll"}, table));
  }

  renderTree();
  renderTags();
}

/* ---------- one tag, every step ---------- */
function openTag(tag) {
  const s = tagStats(tag), kind = fmtOf(tag), f = v => fmtVal(v, kind);
  document.getElementById("modal-title").textContent = tag;
  document.getElementById("modal-desc").textContent = M.docs[tag] || "";
  const stat = (k, v) => `<span><span class="stat-label">${k}</span>${v}</span>`;
  document.getElementById("modal-stats").innerHTML = s
    ? stat("last", f(s.last)) + stat("Δ", deltaHTML(s.last, s.prev, kind) || "—") + stat("min", f(s.min)) +
      stat("max", f(s.max)) + stat("mean", f(s.mean)) + stat("steps", f0(s.n))
    : "no value at any step";
  const body = document.getElementById("modal-body");
  body.innerHTML = "";
  if (s) {
    const t = h("table", {}, [h("thead", {}, h("tr", {}, ["step", "value", "Δ", "raw"].map(x => h("th", {text: x}))))]);
    t.appendChild(h("tbody", {}, s.pts.map(([step, v], i) => h("tr", {}, [
      h("td", {class: "mono", text: `step ${step}`}),
      h("td", {class: "mono", text: f(v)}),
      h("td", {html: i ? (deltaHTML(v, s.pts[i - 1][1], kind) || "—") : "—"}),
      h("td", {class: "mono dim", text: String(v)}),
    ]))));
    body.appendChild(h("div", {class: "scroll", style: "margin-top:12px"}, t));
  }
  if (!S.tag) S.returnHash = location.hash || "#metrics";
  S.tag = tag;
  document.getElementById("modal").classList.remove("hidden");
  history.replaceState(null, "", `#metric/${encodeURIComponent(tag)}`);
}
// ``restore`` is false when the hash already moved on (the router closing a
// modal the user navigated away from), true when the close is the navigation.
function closeModal(restore) {
  const modal = document.getElementById("modal");
  if (modal.classList.contains("hidden")) return;
  modal.classList.add("hidden");
  S.tag = null;
  if (restore !== false) history.replaceState(null, "", S.returnHash || "#metrics");
  S.returnHash = null;
}
document.getElementById("modal").onclick = e => { if (e.target.closest("[data-close]")) closeModal(); };
addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function stepView(st) {
  const wrap = h("div");
  const ideal = st.ideal_s, waste = st.tail_waste_s;
  wrap.appendChild(tiles([
    {v: dur(st.span), k: "rollout span", h: `${f0(st.episodes)} episodes`},
    {v: f1(st.rates.ep_min), k: "episodes / min", h: `${st.slots} container slots`},
    {v: big(st.rates.tok_s), k: "decode tok/s", h: `${big(st.out_tok)} tokens`},
    {v: f0(st.rates.mean_inflight), k: "mean in-flight", h: `peak ${st.peak_inflight}`},
    {v: dur(waste), k: "tail waste", h: `${pct(waste / st.span)} of the span`},
    {v: dur(st.durations.p50), k: "median episode", h: `p99 ${dur(st.durations.p99)}`},
    {v: pct(st.rates.resolved), k: "resolved", h: `mean reward ${st.rates.reward.toFixed(2)}`},
    {v: f1(st.rates.turns), k: "turns / episode", h: `${f0(st.rates.tok_per_req)} tok / turn`},
  ]));

  // --- the trace itself: one row per trajectory
  if (st.grade_share === undefined) {
    let g = 0, t = 0;
    for (const r of st.trace) for (let k = 0; k < r.d.length; k += 2) {
      t += r.d[k + 1]; if (r.d[k] === 5) g += r.d[k + 1];
    }
    st.grade_share = g / t;
  }
  const tr = card("Trajectory trace",
    `Every one of the ${f0(st.episodes)} episodes as its own row, admitted top to bottom, on the rollout's ` +
    `own clock. Zoom in far enough and a row resolves into its turns: generate, tool call, generate. ` +
    `A row runs past the end of its episode because grading happens after the agent loop stops: ` +
    `<b>${pct(st.grade_share)}</b> of the traced time, and the step waits on the last verdict — which is ` +
    `why the generate phase ends <b>${dur(st.gen_dur - st.t_offset - st.span)}</b> after the last episode.`);
  const trHost = h("div", {style: "position:relative"});
  tr.body.appendChild(trHost);
  wrap.appendChild(tr.card);
  queueMicrotask(() => traceView(trHost, st));

  // --- occupancy + throughput, shared x
  const xs = st.series.episodes.map((_, i) => i * st.dt);
  const oc = st.occupancy || {regions: [], peak: st.peak_inflight, lost_total: 0};
  const REGION = {ramp: CAT[3], plateau: CAT[2], drain: CAT[1], grading: CAT[4], assembly: CAT[7]};
  const worst = oc.regions.slice().sort((a, b) => b.pct_lost - a.pct_lost)[0];
  const occ = card("Rollout occupancy over the span",
    `Concurrent episodes and the requests actually in flight on the server, sampled every ${f1(st.dt)}s, ` +
    `across the whole generate phase. The phase is not one regime: it fills, holds at what the container ` +
    `cap allows, <b>drains</b> once the admission queue is empty and nothing refills a freed slot, then ` +
    `sits at zero requests while grading containers and verl finish. ` +
    (worst ? `Most of the idle GPU is in <b>${worst.name}</b> — ${pct(worst.pct_lost)} of ` +
      `${big(oc.lost_total)} slot-seconds lost against a peak of ${oc.peak} in flight.` : ""));
  const occHost = h("div", {style: "position:relative"});
  occ.body.appendChild(occHost);
  const thrHost = h("div", {style: "position:relative"});
  occ.body.appendChild(h("div", {style: "font-size:12.5px;color:var(--ink-2);margin:14px 0 -4px",
    text: "decode throughput, cluster-wide (tok/s)"}));
  occ.body.appendChild(thrHost);
  if (oc.regions.length) {
    const rh = ["region", "window", "% of phase", "mean in-flight", "slot-s lost", "% of loss"];
    const rt = h("table", {}, [h("thead", {}, h("tr", {}, rh.map(x => h("th", {text: x}))))]);
    rt.appendChild(h("tbody", {}, oc.regions.map(r => h("tr", {}, [
      h("td", {html: `<span class="swatch" style="background:${REGION[r.name] || "var(--axis)"}"></span>` +
        `<span style="margin-left:6px">${r.name}</span>`}),
      h("td", {text: `${dur(r.t0)} – ${dur(r.t1)}`}),
      h("td", {text: pct(r.pct_span)}),
      h("td", {text: f0(Math.max(0, Math.min(oc.peak,
        oc.peak * (1 - r.lost / Math.max(r.dur * oc.peak, 1e-9)))))}),
      h("td", {text: big(r.lost)}),
      h("td", {text: pct(r.pct_lost)}),
    ]))));
    occ.body.appendChild(h("div", {class: "scroll", style: "margin-top:14px"}, rt));
  }
  wrap.appendChild(occ.card);
  queueMicrotask(() => {
    const bands = oc.regions.map(r => ({t0: r.t0, t1: r.t1, label: r.name,
      color: REGION[r.name] || "var(--axis)"}));
    lineChart(occHost, {x: xs, height: 200, xAxis: false, bands,
      markers: [{x: ideal, label: "perfect packing ends"}],
      series: [{name: "episodes in the agent loop", color: CAT[0], v: st.series.episodes, fill: true},
               {name: "episodes decoding (requests on the GPU)", color: CAT[1], v: st.series.inflight},
               {name: "episodes in reward grading", color: CAT[4], v: st.series.grading || []}]});
    lineChart(thrHost, {x: xs, height: 150, bands,
      markers: [{x: ideal, label: ""}], fmt: v => f0(v) + " tok/s",
      series: [{name: "decode tok/s", color: CAT[0], v: st.series.tok_s, fill: true}]});
  });

  // --- throughput vs concurrency
  const row = h("div", {class: "row"});
  const thr = card("Cluster throughput by in-flight band",
    "What the server delivers at each load regime. Batching is the whole story.");
  const lat = card("Per-request decode latency by band",
    "The same regimes, per request: 5× slower per token at the plateau, and that is the trade.");
  const thrB = h("div", {style: "position:relative"}), latB = h("div", {style: "position:relative"});
  thr.body.appendChild(thrB); lat.body.appendChild(latB);
  row.appendChild(thr.card); row.appendChild(lat.card);
  wrap.appendChild(row);
  queueMicrotask(() => {
    barChart(thrB, {height: 200, color: CAT[0], valueName: "decode", fmt: v => f0(v) + " tok/s",
      items: st.bands.map(b => ({label: b.label, value: b.tok_s, foot: pct(b.pct_span) + " of span",
        sub: `${pct(b.pct_tok)} of the step's tokens`}))});
    barChart(latB, {height: 200, color: CAT[1], valueName: "latency", fmt: v => f1(v) + " ms/tok",
      items: st.bands.map(b => ({label: b.label, value: b.ms_per_tok, foot: f0(b.requests) + " req",
        sub: `${big(b.tokens)} tokens`}))});
  });

  // --- durations
  const dcard = card("Episode duration, ordered",
    `Every episode sorted shortest to longest. Median <b>${dur(st.durations.p50)}</b>, ` +
    `p90 <b>${dur(st.durations.p90)}</b>, p99 <b>${dur(st.durations.p99)}</b>, ` +
    `max <b>${dur(st.durations.max)}</b> — a ${f1(st.durations.p99 / st.durations.p50)}× straggler ratio.`);
  const dHost = h("div", {style: "position:relative"});
  dcard.body.appendChild(dHost);
  wrap.appendChild(dcard.card);
  queueMicrotask(() => lineChart(dHost, {x: st.durations.curve.map((_, i) => i / 3), height: 200,
    xFmt: v => f0(v) + "%", yFmt: dur, xName: "of episodes are shorter than", fmt: dur,
    markers: [{x: 50, label: "p50"}, {x: 90, label: "p90"}, {x: 99, label: "p99"}],
    series: [{name: "episode duration", color: CAT[0], v: st.durations.curve, fill: true}]}));

  // --- where the seconds go
  const row2 = h("div", {class: "row"});
  const ew = card("Episode wall clock",
    "Summed over every episode. An episode is decode; tool execution barely registers.");
  const rw = card("Request wall clock",
    "Summed over every server request. Queueing is small — the batch is admission-limited, not server-limited.");
  const ewH = h("div", {style: "position:relative"}), rwH = h("div", {style: "position:relative"});
  ew.body.appendChild(ewH); rw.body.appendChild(rwH);
  row2.appendChild(ew.card); row2.appendChild(rw.card);
  wrap.appendChild(row2);
  queueMicrotask(() => {
    stackBar(ewH, {height: 30, segments: [
      {label: "decode", value: st.ep_wall.decode, color: CAT[0]},
      {label: "tool", value: st.ep_wall.tool, color: CAT[1]},
      {label: "other", value: st.ep_wall.other, color: CAT[2]}]});
    stackBar(rwH, {height: 30, segments: [
      {label: "decode", value: st.req_time.decode, color: CAT[0]},
      {label: "prefill", value: st.req_time.prefill, color: CAT[1]},
      {label: "queue", value: st.req_time.queue, color: CAT[2]}]});
  });

  // --- outcomes + tools
  const row3 = h("div", {class: "row"});
  const ex = card("How episodes ended",
    `<b>${pct((st.exits.find(e => e[0] === "Submitted") || [0, 0])[1] / st.episodes)}</b> ` +
    `reached the submit tool; every other status is an episode a guard stopped.`);
  const toolTotal = st.actions.reduce((a, t) => a + t.s, 0);
  const tl = card("Tool calls",
    `${f0(st.tool_calls)} calls, ${dur(toolTotal)} of wall clock in total — ` +
    `${pct(toolTotal / (st.ep_wall.decode + st.ep_wall.tool + st.ep_wall.other))} of episode wall clock. ` +
    `Grouped by what the call ran, not by which tool ran it.`);

  queueMicrotask(() => {
    barChart(exH, {height: 190, color: CAT[0], valueName: "episodes", fmt: f0,
      items: st.exits.map(([k, v]) => ({label: k.replace(/Limit$/, ""), value: v,
        foot: pct(v / st.episodes), sub: k}))});
    // By total wall clock, because that is the thing a rollout pays: the long
    // tail is one-off programs and names the model invented, which cost nothing
    // individually and are worth one row between them.

    const items = top.map(t => ({label: t.action, value: t.s,

      sub: rest.slice(0, 6).map(t => `${t.action} ${f0(t.s)}s`).join(", ")});
    barChart(tlH, {height: 190, color: CAT[1], valueName: "wall clock", fmt: dur, items});
  });

  // --- every action as numbers, in whichever order the question needs
  const atbl = card("Tool calls by what they ran",
    `${st.actions.length} distinct actions this step. Click a column to re-sort: ` +
    `<b>total</b> is what the step pays, <b>calls</b> is how often the policy reaches for it, ` +
    `<b>mean</b>/<b>p90</b>/<b>max</b> are one call — a rare program can be slow and still cost nothing.`);
  atbl.body.appendChild(sortTable([
    {k: "action", label: "action", help: "the edit sub-command, or the first real program on the bash line"},
    {k: "tool", label: "tool", dim: true, help: "the registry entry that ran it"},
    {k: "calls", label: "calls", fmt: f0},
    {k: "s", label: "total", fmt: dur},
    {k: "pct", label: "% tool", fmt: pct},
    {k: "mean", label: "mean", fmt: perCall},
    {k: "p50", label: "p50", fmt: perCall},
    {k: "p90", label: "p90", fmt: perCall},
    {k: "max", label: "max", fmt: perCall},
    {k: "err", label: "nonzero rc", fmt: (v, r) => v ? `${f0(v)} (${pct(v / r.calls)})` : "0"},
  ], st.actions, "s"));
  wrap.appendChild(atbl.card);

  // --- table view (accessibility + the numbers)
  const tbl = card("Band table", "The same in-flight bands as numbers.");
  const head = ["in-flight", "wall s", "% span", "requests", "tokens", "% tok", "ms/tok/req", "tok/s"];
  const t = h("table", {}, [h("thead", {}, h("tr", {}, head.map(x => h("th", {text: x}))))]);
  t.appendChild(h("tbody", {}, st.bands.map(b => h("tr", {}, [
    h("td", {text: b.label}), h("td", {text: f0(b.wall)}), h("td", {text: pct(b.pct_span)}),
    h("td", {text: f0(b.requests)}), h("td", {text: f0(b.tokens)}), h("td", {text: pct(b.pct_tok)}),
    h("td", {text: f1(b.ms_per_tok)}), h("td", {text: f0(b.tok_s)})]))));
  tbl.body.appendChild(h("div", {class: "scroll"}, t));
  tbl.body.appendChild(h("p", {class: "note", style: "margin-top:10px", html:
    `Prefill: <b>${big(st.prompt_tok)}</b> prompt tokens seen, <b>${pct(st.cached_tok / st.prompt_tok)}</b> ` +
    `served from the prefix cache, leaving <b>${big((st.prompt_tok - st.cached_tok) / st.span)}</b> tok/s of real prefill.`}));
  wrap.appendChild(tbl.card);
  return wrap;
}

/* ---------- routing ---------- */
function render() {
  for (const [name, host] of Object.entries(VIEW)) host.classList.toggle("active", name === S.view);
  for (const a of document.querySelectorAll(".nav-tabs a"))
    a.classList.toggle("active", a.dataset.view === S.view);
  if (S.view === "metrics") metricsView(VIEW.metrics);
  else overviewView(VIEW.overview);
}

function route() {
  const raw = location.hash.replace(/^#/, "");
  const cut = raw.indexOf("/");
  const head = cut < 0 ? raw : raw.slice(0, cut);
  const tail = cut < 0 ? "" : raw.slice(cut + 1);
  if (head === "metric" && tail) {   // a link to one tag: open the group, then it
    const tag = decodeURIComponent(tail);
    S.view = "metrics";
    S.path = tag.includes("/") ? tag.slice(0, tag.lastIndexOf("/")) : "";
    render();
    openTag(tag);
    return;
  }
  closeModal(false);
  if (head === "metrics") {
    S.view = "metrics";
    S.path = tail && nodeAt(tail) ? tail : "";
  } else {
    S.view = "overview";
  }
  render();
}

for (const a of document.querySelectorAll(".nav-tabs a"))
  a.onclick = () => go(a.dataset.view === "metrics" ? `#metrics/${S.path}` : "#overview");

/* ---------- theme: the trace is painted on a canvas, so a switch repaints ---------- */
(function () {
  const btn = document.getElementById("theme-toggle");
  try {
    const stored = localStorage.getItem("timeline-theme");
    if (stored) document.documentElement.setAttribute("data-theme", stored);
  } catch (e) { /* private window: keep the OS theme */ }
  btn.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("timeline-theme", next); } catch (e) { /* ignore */ }
    if (DATA) render();
  };
})();

/* ---------- boot ---------- */
if (!DATA) {
  document.getElementById("brand").textContent = "timeline report";
  document.getElementById("main").innerHTML =
    `<p class="note">This file is the report <b>template</b>, not a report: the run's data is ` +
    `substituted into it by <b>scripts/plot_timeline.py</b>. Render one with ` +
    `<span class="mono">python scripts/plot_timeline.py --dir analysis/&lt;run&gt;/timeline</span>, ` +
    `which writes <b>timeline.html</b> next to that run's log.</p>`;
} else {
  document.title = `timeline · ${DATA.experiment}`;
  document.getElementById("brand").textContent = DATA.experiment;
  addEventListener("hashchange", route);
  route();
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
}
</script>
